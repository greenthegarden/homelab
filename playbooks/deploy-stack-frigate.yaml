---
- name: Deploy Frigate Stack

  hosts: frigate

  vars:

    # Frigate facts
    # renovate: datasource=docker depName=ghcr.io/blakeblackshear/frigate
    frigate_image: ghcr.io/blakeblackshear/frigate:0.17.1
    mqtt_broker: "emqx.lxc-messaging.{{ lan_domain }}"

  pre_tasks:

    - name: Ensure base environment is configured
      ansible.builtin.include_tasks:
        file: tasks/configure-containerised-base.yaml

    - name: Load homelab vars
      ansible.builtin.include_vars:
        file: vars/homelab_env.yaml

  tasks:

    ########### Deploy Frigate
    - name: Deploy a containerised instance of Frigate
      ansible.builtin.include_tasks:
        file: tasks/deploy-frigate.yaml
