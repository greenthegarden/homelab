---
- name: Deploy AFFiNE

  hosts: productivity

  vars:
    # Affine facts
    # renovate: datasource=docker depName=ghcr.io/toeverything/affine
    affine_image: ghcr.io/toeverything/affine:0.26.7
    affine_deploy_docker_volume_backup: true

  pre_tasks:
    - name: Load homelab vars
      ansible.builtin.include_vars:
        file: vars/homelab_env.yaml

  tasks:
    - name: Deploy a containerised instance of AFFiNE
      ansible.builtin.include_tasks:
        file: tasks/deploy-affine.yaml
