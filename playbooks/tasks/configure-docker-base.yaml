---

- name: configure-docker-base | Load homelab vars
  ansible.builtin.include_vars:
    file: vars/homelab_env.yaml

- name: configure-docker-base | Configure base OS
  ansible.builtin.include_tasks:
    file: tasks/configure-base-os.yaml

- name: configure-docker-base | Check Docker is available  # noqa: syntax-check[unknown-module]
  community.docker.docker_host_info:
  register: host_docker_info
  ignore_errors: true

# TODO: only install if not present
- name: configure-docker-base | Install Docker
  when: (host_docker_info.can_talk_to_docker is defined and not host_docker_info.can_talk_to_docker) or
        (host_docker_info is failed)
  ansible.builtin.import_role:
    name: geerlingguy.docker
  vars:
    docker_install_compose: false
    docker_users:
      - root
