- name: deploy-hawser | Pull Hawser image
  community.docker.docker_image:
    name: "{{ hawser_image }}"
    source: pull
  tags: hawser

- name: deploy-hawser | Deploy Hawser Agent
  community.docker.docker_container:
    name: "{{ hawser_service_name }}"
    image: "{{ hawser_image }}"
    detach: true
    # env_file: "{{ hawser_config_dir }}/hawser.env"
    env:
      STACKS_DIR: "{{ hawser_stacks_dir }}"
    labels: "{{ hawser_container_labels | default(omit) }}"
    networks_cli_compatible: true
    networks: "{{ hawser_networks | ansible.utils.remove_keys(target=['internal']) | default(omit) }}"
    published_ports: "{{ hawser_ports | default(omit) }}"
    restart: true
    restart_policy: unless-stopped
    state: started
    volumes: "{{ default_host_volumes + docker_host_volume + hawser_volumes | default(omit) }}"
  register: hawser_container_state
  tags: hawser
