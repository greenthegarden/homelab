---
# This playbook deploys support services for the homelab environment and are intended to be run on all Homelab LXC based servers.

# The services include:
# - Hawser (Dockhand Agent)
# - Beszel Agent
# - Dozzle Agent
# - Portainer Agent
# - Socket Proxy
# - Docker Socket Proxy
# - Traefik
# - Tinyauth
# - Node Exporter
# - Prometheus
# - Atlas

# Load environment variables applicable to the homelab environment
- name: configure-containerised-base | Load homelab vars
  ansible.builtin.include_vars:
    file: vars/homelab_env.yaml
  tags: always

# Ensure docker is installed and configured on the host
- name: configure-containerised-base | Configure Homelab Docker base
  ansible.builtin.include_tasks:
    file: tasks/configure-docker-base.yaml
  tags: always

# Use the following agents to monitor Docker services via host docker socket (/var/run/docker.sock)

- name: configure-containerised-base | Deploy a containerised instance of a Hawser
  ansible.builtin.include_tasks:
    file: tasks/deploy-hawser.yaml
  tags:
    - dockhand
    - hawser

- name: configure-containerised-base | Deploy a containerised instance of a Beszel Agent
  when: deploy_beszel_agent | default(false)
  ansible.builtin.include_tasks:
    file: tasks/deploy-beszel-agent.yaml
  tags: beszel

- name: configure-containerised-base | Deploy a containerised instance of a Dozzle Agent
  when: deploy_dozzle_agent | default(false)
  ansible.builtin.include_tasks:
    file: tasks/deploy-dozzle-agent.yaml
  tags: dozzle

# Use the following socket proxies to provide controlled access to the Docker socket for services that require it
# Consider also https://blog.foxxmd.dev/posts/restricting-socket-proxy-by-container/

- name: configure-containerised-base | Deploy an exposed containerised instance of Socket Proxy configured for use by Homepage and Uptime Kuma
  ansible.builtin.include_tasks:
    file: tasks/deploy-socket-proxy.yaml
  vars:
    socket_proxy_service_name: "{{ 'socket-proxy_' + item.name }}"
    socket_proxy_service_port: "{{ item.port }}"
    socket_proxy_network_name: "{{ 'socket-proxy_' + item.name }}"
    socket_proxy_network_internal: false
    socket_proxy_command_service: "{{ item.command }}"
  loop:
    - name: uptimekuma
      port: "{{ (socket_proxy_ports.uptimekuma | default(2377)) | int }}"
      command: ["-allowfrom=uptimekuma,uptimekuma.lxc-monitor.{{ homelab.certificate_domain | default('localdomain') }}", "-allowGET=.*"]
    - name: wud
      port: "{{ (socket_proxy_ports.wud | default(2378)) | int }}"
      command: ["-allowfrom=wud,wud.lxc-monitor.{{ homelab.certificate_domain | default('localdomain') }}", "-allowGET=.*"]
    - name: homepage
      port: "{{ (socket_proxy_ports.homepage | default(2379)) | int }}"
      command: ["-allowfrom=172.31.0.1/32,homepage,homepage.lxc-home.{{ homelab.certificate_domain | default('localdomain') }}", "-allowGET=.*"]
    - name: authentik_worker
      port: "{{ (socket_proxy_ports.authentik_worker | default(2380)) | int }}"
      command: ["-allowfrom=authentik_worker,authentik_worker.lxc-home.{{ homelab.certificate_domain | default('localdomain') }}", "-allowGET=.*"]

# Use Traefik as a reverse proxy to manage access to web services with SSL via Let's Encrypt

- name: configure-containerised-base | Deploy a containerised instance of Traefik
  ansible.builtin.include_tasks:
    file: tasks/deploy-traefik.yaml

# Use Tinyauth to provide basic authentication for web services

- name: configure-containerised-base | Deploy a containerised instance of Tinyauth
  when: deploy_tinyauth | default(false)
  ansible.builtin.include_tasks:
    file: tasks/deploy-tinyauth.yaml
